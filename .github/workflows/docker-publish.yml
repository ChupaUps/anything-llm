name: Build and Push to GHCR

on:
  push:
    branches: [ "my-customization", "main" ] # Срабатывает при пуше в эти ветки
  workflow_dispatch: # Позволяет запускать вручную из вкладки Actions

env:
  REGISTRY: ghcr.io
  # Здесь мы жёстко задаём имя образа, которое вы хотели
  IMAGE_NAME: chupaUps/interstorm-ai

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile # Указываем путь к Dockerfile внутри папки docker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
